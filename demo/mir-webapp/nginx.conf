server {
  listen 8080;                 # image nginx non-root : port non privilégié (> 1024)
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA : toute route inconnue retombe sur index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy vers le backend units-service : même origine, donc pas de CORS ni de préflight,
  # et l'en-tête traceparent posé par Faro est transmis tel quel -> la trace se continue côté Django.
  location /api/ {
    proxy_pass http://units-service:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
