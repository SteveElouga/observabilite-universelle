# loki-config.yaml — mono-nœud, stockage local (S3/MinIO à l'échelle, §7.1)
# ⚠ auth_enabled: false = LAB ; à protéger par réseau/proxy avant la prod (§7.4).
auth_enabled: false
server: { http_listen_port: 3100 }
common:
  path_prefix: /loki
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
  storage: { filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules } }
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      # `period: 24h` n'est pas cosmétique : la rétention Loki n'est appliquée QUE si
      # la période d'index vaut 24 h (documentation officielle, « Log retention »).
      index: { prefix: index_, period: 24h }
limits_config:
  allow_structured_metadata: true      # requis pour l'ingestion OTLP (trace_id & co.)
  # 90 jours — c'est la politique de conservation des journaux du projet consommateur
  # (LOG_RETENTION_DAYS=90 côté applicatif) et le minimum d'une période d'observation
  # SOC 2 Type II. Avant le 14/09/2026 cette clé valait 720h SANS bloc `compactor` :
  # elle était donc décorative (voir ci-dessous) et les journaux — qui contiennent des
  # données personnelles (numéros de téléphone) — vivaient indéfiniment (RGPD art. 5.1.e).
  retention_period: 2160h

# LE BLOC QUI MANQUAIT, et sans lequel `retention_period` ne fait RIEN. Documentation
# Loki (« Log retention ») : « retention_enabled should be set to true. Without this,
# the Compactor will only compact tables » — et, plus haut, « By default the
# compactor.retention-enabled flag is not set, so the logs sent to Loki live forever ».
# Constaté en direct avant correction : `curl :3100/config` rendait
# `retention_enabled: false` et `delete_request_store: ""`.
#
# `delete_request_store` est OBLIGATOIRE dès que la rétention est active (Loki refuse
# de démarrer sinon) : ici `filesystem`, cohérent avec `common.storage.filesystem`.
compactor:
  working_directory: /loki/compactor   # tables temporaires + marqueurs de chunks à supprimer
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  # Délai entre le marquage d'un chunk et sa suppression réelle : une fenêtre pour
  # annuler une demande de suppression avant qu'elle ne devienne irréversible.
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
