# tempo-config.yaml — mono-nœud (stockage pur des traces)
# NB : pas de metrics_generator ici — la carte des services est alimentée par les
# connecteurs du Collector (§10.3), calculés sur 100 % des traces AVANT échantillonnage.
# Activer en plus le metrics_generator de Tempo ferait double emploi (double comptage).
server: { http_listen_port: 3200 }
distributor:
  # endpoint explicite en 0.0.0.0 : Tempo 2.7+ écoute sinon sur localhost (injoignable inter-conteneurs)
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
storage:
  trace:
    backend: local
    local: { path: /var/tempo/blocks }
    wal:   { path: /var/tempo/wal }
compactor:
  # 30 jours de traces (§7.3). Auparavant 360h (15 j) : trop court pour rejouer un
  # incident du mois précédent et pour une période d'observation SOC 2 Type II, alors
  # que la politique de conservation du projet consommateur est de 90 j pour les
  # journaux. Compromis assumé et documenté (README.md, « Conservation par signal ») :
  # les traces coûtent bien plus cher au stockage que les journaux, 30 j couvrent le cycle
  # de facturation mensuel, les journaux (Loki, 90 j) restent la mémoire longue.
  compaction: { block_retention: 720h }
