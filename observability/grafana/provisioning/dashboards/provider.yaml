# grafana/provisioning/dashboards/provider.yaml — chargement des dashboards (§8.3)
#
# Les JSON vivent dans des sous-répertoires et non ici : Grafana scrute `options.path` à la
# recherche de fichiers .json, et y laisser ce YAML à côté marche mais brouille la lecture. Un
# répertoire = les dashboards, un fichier = leur déclaration.
#
# `allowUiUpdates: false` — les modifications faites à la souris ne survivent pas au
# redémarrage, et c'est voulu : le dashboard versionné est la seule vérité. Qui veut changer un
# panneau l'exporte, remplace le JSON, et le fait passer en revue comme du code.
#
# Deux dossiers, et aucun ne nomme un projet :
#   · « Socle »  : les écrans GÉNÉRIQUES, versionnés ici et embarqués dans l'image ;
#   · « Projet » : les écrans du PROJET OBSERVÉ, qu'il fournit lui-même en montant ses JSON dans
#     `dashboards/consommateur/` (lecture seule). Le répertoire est vide dans l'image et dans le
#     dépôt (un `.gitkeep`, sans lequel le montage échouerait en mode compose : on ne crée pas
#     de point de montage sous un `./grafana/provisioning` déjà monté en `:ro`). Vide, il ne
#     provisionne rien et Grafana ne signale aucune erreur. Voir README, « Ce que le projet
#     fournit ».
apiVersion: 1
providers:
  - name: socle
    orgId: 1
    folder: Socle          # dossier visible dans Grafana ; regroupe les sept écrans
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/socle
      foldersFromFilesStructure: false

  - name: consommateur
    orgId: 1
    folder: Projet
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/consommateur
      foldersFromFilesStructure: false
