# prometheus/rules/infra.yml — saturation et disponibilité de l'hôte (§8.4)
# Source : node-exporter, désormais EMBARQUÉ dans l'image (voir docker/supervisord.conf).
# Avant cet ajout, prometheus.yml scrutait « node-exporter:9100 » — une cible qui n'existait
# qu'en mode compose. En mode image le job tombait, et l'alerte disque était donc muette.
groups:
  - name: saturation-hote
    rules:
      # UNE SEULE définition de « système de fichiers digne d'alerte », partagée par les deux
      # seuils ET par le dashboard « Vue d'ensemble ». Trois copies d'un filtre finissent
      # toujours par diverger.
      #
      # Ce qui est exclu, et pourquoi (corrigé le 14/09/2026) :
      #   · tmpfs / ramfs         — vivent en RAM ;
      #   · overlay / squashfs    — couches d'image, pleines par construction ;
      #   · erofs                 — racine EN LECTURE SEULE de la VM Docker Desktop
      #                             (`/oldroot`), à 100,0 % par nature : elle déclenchait
      #                             « DisquePresquePlein » (severity=page) EN PERMANENCE, et
      #                             ce page sans `service_name` inhibait au passage tous les
      #                             tickets sans service (voir alertmanager.yml) ;
      #   · fuse.* / fakeowner / selfowner / virtiofs*
      #                           — montages de commodité de Docker Desktop qui reflètent le
      #                             disque du poste : ils faisaient sonner cinq à sept fois le
      #                             MÊME remplissage sous des points de montage différents ;
      #   · mountpoint /run|/oldroot|/host|/proc|/sys
      #                           — plomberie de la VM, jamais un volume applicatif ;
      #   · tout système monté en lecture seule (`node_filesystem_readonly == 1`) : on ne peut
      #     rien y libérer, donc l'alerte n'a aucune action possible — règle §8.4.
      #
      # Vérifié en direct sur la pile du 14/09/2026 : 18 séries avant filtre (dont `/oldroot`
      # à 100 %), 2 après (`/var/lib` et `/var/lib/docker`, ext4, 61,5 %).
      - record: instance:systeme_fichiers_rempli:ratio
        expr: |
          (
            100 - (
              node_filesystem_avail_bytes{
                fstype!~"tmpfs|overlay|squashfs|ramfs|erofs|iso9660|autofs|nsfs|devtmpfs|fuse\\..*|fakeowner|selfowner|virtiofs.*",
                mountpoint!~"/(run|oldroot|host|proc|sys)($|/.*)"
              }
              / node_filesystem_size_bytes * 100
            )
          )
          unless on (instance, mountpoint) (node_filesystem_readonly == 1)

      # Deux seuils, deux gravités : à 80 % on planifie, à 90 % on intervient.
      - alert: DisqueBientotPlein
        expr: instance:systeme_fichiers_rempli:ratio > 80
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.instance }} : {{ $labels.mountpoint }} rempli à {{ $value | printf \"%.1f\" }} %"
          description: >-
            Planifier une purge ou une extension. Les gros consommateurs habituels sont la
            rétention Prometheus (90 j), les blocs Tempo (30 j) et les segments Loki (90 j),
            puis le cache de construction Docker.
          runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#disquebientotplein"

      - alert: DisquePresquePlein
        expr: instance:systeme_fichiers_rempli:ratio > 90
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.instance }} : {{ $labels.mountpoint }} rempli à {{ $value | printf \"%.1f\" }} %"
          description: >-
            Intervention immédiate. Au-delà de 95 %, PostgreSQL refuse les écritures et la
            plateforme perd ses propres données d'observation — on devient aveugle pendant la panne.
          runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#disquepresqueplein"

  - name: disponibilite-cibles
    rules:
      # `up == 0` couvre TOUTE cible scrutée. Les jobs optionnels (postgres, rabbitmq, keycloak)
      # sont découverts par fichier et valent « [] » par défaut : sans cible, aucune série `up`,
      # donc aucune alerte pour un composant que personne n'a branché. C'est la raison d'être du
      # file_sd — un static_configs vide-mais-déclaré aurait sonné en continu.
      - alert: CibleInjoignable
        expr: up == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} / {{ $labels.instance }} ne répond plus"
          description: >-
            Prometheus n'obtient plus de métriques depuis deux minutes. Distinguer la panne du
            composant de celle de la collecte : si TOUTES les cibles tombent d'un coup, le
            suspect est le réseau ou la plateforme, pas les services observés.
          runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#cibleinjoignable"
