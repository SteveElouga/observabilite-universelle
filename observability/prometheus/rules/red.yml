# prometheus/rules/red.yml — alertes sur les SYMPTÔMES utilisateur (méthode RED, §10.6)
# Basé sur les métriques dérivées des spans par le Collector (connecteur spanmetrics, §10.3),
# calculées sur 100 % du trafic AVANT échantillonnage :
#   traces_span_metrics_calls_total                  -> débit et erreurs (label status_code)
#   traces_span_metrics_duration_milliseconds_bucket -> latence (en millisecondes)
#
# Les deux alertes ne lisent QUE les spans serveur (`span_kind="SPAN_KIND_SERVER"`, dimension
# par défaut du connecteur, vérifiée sur otelcol-contrib 0.116.1). Une requête servie produit
# aussi des spans CLIENT (appel gRPC sortant, requête SQL) et INTERNAL : en les comptant, une
# dépendance en panne faisait sonner l'appelant ET l'appelé pour la même cause, et une requête
# SQL lente passait pour une requête utilisateur lente. Le symptôme RED, c'est ce que le service
# REND ; ses appels sortants se lisent au diagnostic, dans le tableau « Par service ».
groups:
  - name: service-red
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER"}[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.service_name }} : {{ $value | humanizePercentage }} de requêtes servies en erreur"
          runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#higherrorrate"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum by (le, service_name)
            (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER"}[5m]))) > 500
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.service_name }} : p99 > 500 ms"
          runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#highlatencyp99"
