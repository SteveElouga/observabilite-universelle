# prometheus/prometheus.yml — collecte des métriques (§10.4)
global: { scrape_interval: 15s, evaluation_interval: 15s }
# `rules/consommateur/*.yml` : les règles PROPRES à un projet observé, montées par lui en lecture
# seule (README, « Règles d'un consommateur »). L'image reste universelle : elle n'embarque que le
# répertoire, vide (un `.gitkeep`, sans lequel le montage échouerait en mode compose : on ne crée
# pas de point de montage sous un `./prometheus` déjà monté en `:ro`). Un motif sans fichier ne
# déclare rien et ne lève aucune erreur — prouvé par tests/test_configurations.py.
rule_files: ["rules/*.yml", "rules/consommateur/*.yml"]   # red.yml + rules-slo.yml (sloth, voir README)
# Jobs de DÉMONSTRATION, hors de ce fichier parce que ce fichier voyage dans l'image publiée :
# `scrape.d/demo.yml` (job `blackbox-demo`) est monté en compose et exclu de l'image par
# .dockerignore. Un motif qui ne correspond à aucun fichier est accepté sans erreur — vérifié
# avec `promtool check config` de Prometheus v3.1.0 — : l'image démarre donc sans lui.
scrape_config_files: ["scrape.d/*.yml"]
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: otel-collector           # santé du pipeline lui-même (écran 12)
    static_configs: [{ targets: ["otel-collector:8888"] }]

  # Santé de la CHAÎNE D'ALERTE elle-même. Ajouté le 14/09/2026 : Alertmanager n'était pas
  # scruté du tout, donc `alertmanager_notifications_failed_total` n'existait nulle part —
  # et 1 447 échecs de notification en 72 h sont passés totalement inaperçus. Une plateforme
  # qui ne surveille pas son propre canal d'alerte ne sait pas qu'elle est muette.
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]

  # --- Sondes en boîte noire (§10.7 / §4.8) : Blackbox teste les endpoints en HTTP, sans
  #     instrumentation, et complète la vue « boîte blanche » des métriques applicatives.
  #     Le vrai point de vue hors infra reste Uptime Kuma (uptime-kuma/README.md).
  - job_name: blackbox-platform        # surfaces toujours actives quand la pile tourne
    metrics_path: /probe
    params: { module: [http_local] }
    static_configs:
      - targets:
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/healthy
          - http://loki:3100/ready
          - http://tempo:3200/ready
          - http://alertmanager:9093/-/healthy
          # Ajouté le 15/09/2026. Pyroscope est resté mort trois jours (OOMKilled le 12/09)
          # sans qu'aucune série ne le dise : il n'est pas scruté (il ne pousse pas de
          # métriques) et ne figurait dans aucune sonde. `/ready` répond 200 une vingtaine de
          # secondes après le démarrage (503 « Ingester not ready » avant) : le `for: 2m` de
          # ProbeDown couvre largement ce délai, un redémarrage ne produit donc pas de page.
          - http://pyroscope:4040/ready
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }

  # --- Sondes de l'APPLICATION CONSOMMATRICE. Sans elles, la plateforme voyait la santé de
  #     Grafana et d'une démo, mais rien de l'application réelle : 100 % des envois d'un canal
  #     de messagerie échouaient depuis deux jours chez un consommateur sans qu'aucune alerte
  #     n'existe (constat du 11/09/2026).
  #
  #     Deux jobs, parce que les deux familles de cibles ne se sondent pas pareil :
  #       · `blackbox-application-graphql` : la passerelle GraphQL, joignable par nom sur le
  #         réseau partagé `obs-edge`, sondée par une requête `{__typename}` (module http_graphql).
  #       · `blackbox-application-http`    : les surfaces qui NE SONT PAS sur `obs-edge` (proxy,
  #         passerelles tierces) — adresses fournies par le consommateur, fichier « [] » sinon.
  #
  #     Les DEUX fichiers valent « [] » dans Git depuis le 15/09/2026. La passerelle GraphQL
  #     faisait exception, écrite en dur : sur toute installation où le consommateur ne tourne
  #     pas sur `obs-edge` — un poste qui ne lance que le socle, par exemple — la sonde échoue
  #     vraiment et « ProbeDown » (severity=page) sonne en permanence, c'est-à-dire exactement le
  #     défaut corrigé la veille sur les cibles de démonstration. L'activation est donc explicite :
  #     profil `application` en compose, `APPLICATION_GRAPHQL_TARGET` et
  #     `APPLICATION_PROBE_TARGETS` en mode image (prometheus/targets/README.md).
  - job_name: blackbox-application-graphql
    metrics_path: /probe
    params: { module: [http_graphql] }
    file_sd_configs: [{ files: ["/etc/prometheus/targets/application-graphql*.yml"] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }

  - job_name: blackbox-application-http
    metrics_path: /probe
    params: { module: [http_local] }
    file_sd_configs: [{ files: ["/etc/prometheus/targets/application-http.yml"] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }

  # --- Cibles OPTIONNELLES du consommateur, découvertes par fichier (prometheus/targets/).
  #     Fichier à `[]` = aucune cible = aucune série, donc aucune fausse alerte « service down ».
  #     L'entrypoint les remplit à partir de DATA_SOURCE_NAME, RABBITMQ_METRICS_TARGET et
  #     KEYCLOAK_METRICS_TARGET. Voir prometheus/targets/README.md.
  - job_name: postgres                 # dashboard PostgreSQL §8.3 (connexions, locks, taille)
    file_sd_configs: [{ files: ["/etc/prometheus/targets/postgres.yml"] }]

  - job_name: rabbitmq                 # dashboard événements §8.3 + alerte DLQ §8.4
    file_sd_configs: [{ files: ["/etc/prometheus/targets/rabbitmq.yml"] }]

  - job_name: keycloak                 # alerte « échecs de connexion anormaux » §8.4
    file_sd_configs: [{ files: ["/etc/prometheus/targets/keycloak.yml"] }]

  # --- Cibles FOURNIES PAR LE PROJET OBSERVÉ : il monte ses fichiers `file_sd` dans
  #     `targets/consommateur/` (lecture seule ; répertoire vide dans l'image, `.gitkeep` dans
  #     le dépôt pour le mode compose). Le job ne nomme aucun projet : c'est le projet qui pose
  #     ses étiquettes, et `__metrics_path__` / `__scheme__` s'il le faut, dans ses fichiers.
  #     Répertoire vide = aucune cible, aucune série, aucune erreur. README, « Ce que le
  #     projet fournit ».
  - job_name: consommateur
    file_sd_configs: [{ files: ["/etc/prometheus/targets/consommateur/*.yml"] }]

  # --- Gabarit PROD : cibles publiques en HTTPS (module http_2xx, exige un TLS valide).
  #     Décommentez et remplacez par vos URLs une fois la plateforme exposée derrière un proxy TLS.
  # - job_name: blackbox-public
  #   metrics_path: /probe
  #   params: { module: [http_2xx] }
  #   static_configs:
  #     - targets: ["https://grafana.example.com/api/health", "https://app.example.com/health"]
  #   relabel_configs:
  #     - { source_labels: [__address__], target_label: __param_target }
  #     - { source_labels: [__param_target], target_label: instance }
  #     - { target_label: __address__, replacement: "blackbox-exporter:9115" }
