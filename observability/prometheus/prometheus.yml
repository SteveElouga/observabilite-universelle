# prometheus/prometheus.yml — collecte des métriques (§10.4)
global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: ["rules/*.yml"]          # red.yml + rules-slo.yml (généré par sloth, voir README)
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: otel-collector           # santé du pipeline lui-même (écran 12)
    static_configs: [{ targets: ["otel-collector:8888"] }]
  # --- Sondes en boîte noire (§10.7 / §4.8) : Blackbox teste les endpoints en HTTP, sans
  #     instrumentation, et complète la vue « boîte blanche » des métriques applicatives.
  #     Le vrai point de vue hors infra reste Uptime Kuma (uptime-kuma/README.md).
  - job_name: blackbox-platform        # surfaces toujours actives quand la pile tourne
    metrics_path: /probe
    params: { module: [http_local] }
    static_configs:
      - targets:
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/healthy
          - http://loki:3100/ready
          - http://tempo:3200/ready
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }

  - job_name: blackbox-demo            # endpoints de la démo (profil compose « demo »)
    metrics_path: /probe
    params: { module: [http_local] }
    static_configs:
      - targets:
          - http://units-service:8000/sante/
          - http://units-webapp:8080/
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }

  # --- Gabarit PROD : cibles publiques en HTTPS (module http_2xx, exige un TLS valide).
  #     Décommentez et remplacez par vos URLs une fois la plateforme exposée derrière un proxy TLS.
  # - job_name: blackbox-public
