# prometheus/prometheus.yml — collecte des métriques (§10.4)
global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: ["rules/*.yml"]          # red.yml + rules-slo.yml (généré par sloth, voir README)
alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
  - job_name: otel-collector           # santé du pipeline lui-même (écran 12)
    static_configs: [{ targets: ["otel-collector:8888"] }]
  - job_name: blackbox                 # sondes externes (§10.7) — ← adaptez les cibles
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ["https://app.example.com/health", "https://api.example.com/health"]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }
