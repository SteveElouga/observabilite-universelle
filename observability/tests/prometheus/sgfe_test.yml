# tests/prometheus/sgfe_test.yml — `promtool test rules`
# Prouve la correction C-172 : les règles SGFE existent ET se déclenchent sur les séries que
# les 9 composants émettent réellement. Le scénario ① rejoue l'incident du 11/09/2026
# (182 envois WhatsApp, 0 abouti, aucune alerte).
rule_files:
  - ../../prometheus/rules/sgfe.yml

evaluation_interval: 1m

tests:
  # ① 100 % d'échec sur le canal WhatsApp : la règle de ratio doit sonner en `page`.
  - interval: 1m
    name: "cent pour cent d envois WhatsApp en echec declenche une page"
    input_series:
      - series: 'sgfe_notification_envoi_total{job="sgfe/notification-service",service_name="notification-service",service_namespace="sgfe",statut="ECHEC",type_envoi="FACTURE"}'
        values: "0+1x45"
      - series: 'sgfe_notification_envoi_total{job="sgfe/notification-service",service_name="notification-service",service_namespace="sgfe",statut="ECHEC",type_envoi="RECU"}'
        values: "0+1x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: SGFEEnvoisWhatsAppEnEchec
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: notification-service
            exp_annotations:
              summary: "SGFE : 100% des envois WhatsApp échouent"
              description: "Plus d'un envoi sur cinq échoue depuis quinze minutes. Vérifier d'abord l'état de la passerelle WhatsApp (`whatsapp-service`, GET /health : `phase` doit valoir `ready`, pas `qr`) : une session non appairée fait échouer 100 % des envois sans qu'aucun service ne tombe. Les envois échoués sont rejoués par le retry automatique, mais les factures ne partent pas tant que la session n'est pas liée."
              runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#sgfeenvoiswhatsappenechec"

  # ② Un taux d'échec normal (1 sur 20 = 5 %) ne doit RIEN déclencher : une alerte qui sonne
  #    pour du bruit finit par ne plus être lue.
  - interval: 1m
    name: "un taux d echec de cinq pour cent ne declenche rien"
    input_series:
      - series: 'sgfe_notification_envoi_total{job="sgfe/notification-service",service_name="notification-service",statut="ECHEC",type_envoi="FACTURE"}'
        values: "0+1x45"
      - series: 'sgfe_notification_envoi_total{job="sgfe/notification-service",service_name="notification-service",statut="ENVOYE",type_envoi="FACTURE"}'
        values: "0+19x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: SGFEEnvoisWhatsAppEnEchec
        exp_alerts: []
      - eval_time: 40m
        alertname: SGFEAucunEnvoiWhatsAppAbouti
        exp_alerts: []

  # ③ On tente, rien n'aboutit, depuis six heures : la seconde filet de sécurité.
  - interval: 5m
    name: "aucun envoi abouti en six heures declenche une page"
    input_series:
      - series: 'sgfe_notification_envoi_total{job="sgfe/notification-service",service_name="notification-service",statut="ECHEC",type_envoi="FACTURE"}'
        values: "0+3x100"
    alert_rule_test:
      - eval_time: 7h
        alertname: SGFEAucunEnvoiWhatsAppAbouti
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: notification-service
            exp_annotations:
              summary: "SGFE : aucun envoi WhatsApp abouti depuis 6 heures"
              description: "Des envois sont tentés, aucun n'aboutit. Symptôme typique d'une session WhatsApp jamais appairée (`phase: qr`) ou expirée. Rien ne parvient aux abonnés : factures, reçus, suspensions et rétablissements sont tous bloqués."
              runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#sgfeaucunenvoiwhatsappabouti"

  # ④ Échecs d'authentification : la version SGFE de la règle Keycloak, sur une série qui
  #    existe pour de bon (`sgfe_auth_connexion_total{resultat="echec"}`).
  - interval: 1m
    name: "plus de vingt echecs de connexion en cinq minutes declenche une page"
    input_series:
      - series: 'sgfe_auth_connexion_total{job="sgfe/auth-service",service_name="auth-service",resultat="echec"}'
        values: "0+10x20"
      - series: 'sgfe_auth_connexion_total{job="sgfe/auth-service",service_name="auth-service",resultat="succes"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: SGFEEchecsAuthentificationAnormaux
        exp_alerts:
          - exp_labels:
              severity: page
              service_name: auth-service
            exp_annotations:
              summary: "SGFE : 50 échecs de connexion en 5 minutes"
              description: "Au-delà de vingt échecs par tranche de cinq minutes, l'hypothèse d'une erreur de saisie ne tient plus. Chercher une adresse source unique dans les journaux du service auth avant de bloquer un compte."
              runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#sgfeechecsauthentificationanormaux"

  # ⑤ Un composant cesse d'émettre : aucune série `up` n'existe pour lui (il POUSSE en OTLP),
  #    d'où la comparaison à la liste attendue.
  - interval: 1m
    name: "un composant qui cesse d emettre sa telemetrie declenche une page"
    input_series:
      - series: 'target_info{job="sgfe/gateway"}'
        values: "1+0x20"
      - series: 'target_info{job="sgfe/auth-service"}'
        values: "1+0x20"
      - series: 'target_info{job="sgfe/abonne-service"}'
        values: "1+0x20"
      - series: 'target_info{job="sgfe/campagne-service"}'
        values: "1+0x20"
      - series: 'target_info{job="sgfe/facturation-service"}'
        values: "1+0x20"
      - series: 'target_info{job="sgfe/paiement-service"}'
        values: "1+0x20"
      - series: 'target_info{job="sgfe/reporting-service"}'
        values: "1+0x20"
      - series: 'target_info{job="sgfe/config-service"}'
        values: "1+0x20"
      # notification-service manque volontairement : c'est le composant muet.
    alert_rule_test:
      - eval_time: 15m
        alertname: SGFEComposantSansTelemetrie
        exp_alerts:
          - exp_labels:
              severity: page
              job: sgfe/notification-service
            exp_annotations:
              summary: "SGFE : sgfe/notification-service n'envoie plus de télémétrie"
              description: "Ce composant ne pousse plus ni trace ni métrique depuis dix minutes. Deux causes possibles, à distinguer AVANT d'agir : le composant est tombé, ou c'est le raccordement au Collector qui est rompu (réseau `obs-edge`, surcouche docker-compose.observability.yml non appliquée). Vérifier les autres composants : s'ils se taisent tous, c'est la seconde."
              runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#sgfecomposantsanstelemetrie"

  # ⑥ Tant que les six ordonnanceurs n'émettent rien, la plateforme DIT qu'elle ne les
  #    surveille pas — au lieu de laisser croire le contraire par une règle muette.
  - interval: 5m
    name: "l absence totale de metrique de cron est signalee"
    input_series:
      - series: 'target_info{job="sgfe/gateway"}'
        values: "1+0x20"
    alert_rule_test:
      - eval_time: 70m
        alertname: SGFECronsNonInstrumentes
        exp_alerts:
          # `dette` et non `ticket`, pour la même raison que `SauvegardeJamaisDeclaree` : une
          # alerte vraie en permanence n'a rien à faire dans le canal d'incident. C'est cette
          # étiquette, et elle seule, qui l'en sort (route `severity="dette"` d'alertmanager.yml).
          - exp_labels:
              severity: dette
            exp_annotations:
              summary: "SGFE : aucune tâche planifiée ne déclare son succès"
              description: "La série `sgfe_cron_last_success_timestamp_seconds` n'existe pas : les six ordonnanceurs APScheduler ne sont pas instrumentés, donc un cron mort ne peut PAS être détecté. Faire émettre l'horodatage de dernier succès par chaque tâche (étiquette `cron`), puis cette alerte s'éteint et `SGFECronEnRetard` prend le relais."
              suivi: "Lacune d'instrumentation du dépôt observé, constat C-349 du 11/09/2026 (aucun indicateur d'état des crons parmi les compteurs métier). Échéance de revue : 15/12/2026. Passé cette date, trancher — instrumenter les six ordonnanceurs, ou retirer les deux règles — plutôt que de laisser cette alerte se répéter indéfiniment."
              runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#sgfecronsnoninstrumentes"
      # Et dès qu'une tâche déclare son succès, cette alerte doit se taire (voir ⑦).

  # ⑦ Une fois les crons instrumentés, l'alerte « non instrumentés » se tait et c'est la
  #    fraîcheur de chaque tâche qui est surveillée. Dans un test promtool, `time()` démarre
  #    à l'époque 0 : un horodatage de dernier succès à -100000 représente une tâche dont le
  #    dernier succès remonte à plus de 27 heures.
  - interval: 5m
    name: "un cron instrumente mais en retard declenche une page"
    input_series:
      - series: 'sgfe_cron_last_success_timestamp_seconds{job="sgfe/paiement-service",cron="relances_impayes"}'
        values: "-100000+0x20"
      - series: 'sgfe_cron_last_success_timestamp_seconds{job="sgfe/reporting-service",cron="reconciliation_nocturne"}'
        values: "0+0x20"
    alert_rule_test:
      - eval_time: 30m
        alertname: SGFECronsNonInstrumentes
        exp_alerts: []
      - eval_time: 30m
        alertname: SGFECronEnRetard
        exp_alerts:
          - exp_labels:
              severity: page
              job: sgfe/paiement-service
              cron: relances_impayes
            exp_annotations:
              summary: "SGFE : la tâche relances_impayes n'a pas abouti depuis 1d 4h 16m 40s"
              description: "26 heures et non 24 : une tâche quotidienne qui glisse de deux heures reste saine. Au-delà, la traiter comme une panne : relances d'impayés non envoyées, statistiques non réconciliées, campagnes non clôturées selon la tâche concernée."
              runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#sgfecronenretard"
