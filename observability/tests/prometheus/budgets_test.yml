# tests/prometheus/budgets_test.yml : `promtool test rules`
# Prouve que les budgets de latence ne lisent que les spans SERVEUR, et que le résumé écrit des
# millisecondes. Les cas ① et ③ donnent le résultat INVERSE avec l'ancienne expression (tous les
# spans confondus) : un retour en arrière fait échouer le test, au lieu de passer en silence.
rule_files:
  - ../../prometheus/rules/budgets.yml

evaluation_interval: 1m

tests:
  # ① Le navigateur tient un flux ouvert plusieurs minutes (span CLIENT « HTTP GET », tout au-delà
  #    de 10 s) : rien ne sonne. Ancienne expression : P95 au dernier seau, l'alerte partait.
  - interval: 1m
    input_series:
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="HTTP GET",span_kind="SPAN_KIND_CLIENT",le="500"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="HTTP GET",span_kind="SPAN_KIND_CLIENT",le="1000"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="HTTP GET",span_kind="SPAN_KIND_CLIENT",le="2000"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="HTTP GET",span_kind="SPAN_KIND_CLIENT",le="5000"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="HTTP GET",span_kind="SPAN_KIND_CLIENT",le="10000"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="HTTP GET",span_kind="SPAN_KIND_CLIENT",le="+Inf"}'
        values: "0+10x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: BudgetLatenceDepasse
        exp_alerts: []

  # ② Un service rend une lecture entre 2 et 5 s : le P95 interpolé vaut 4 850 ms, au-dessus de
  #    2 s. L'alerte part, et son résumé l'écrit en millisecondes.
  - interval: 1m
    input_series:
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="query ListerLesCommandes",span_kind="SPAN_KIND_SERVER",le="500"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="query ListerLesCommandes",span_kind="SPAN_KIND_SERVER",le="1000"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="query ListerLesCommandes",span_kind="SPAN_KIND_SERVER",le="2000"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="query ListerLesCommandes",span_kind="SPAN_KIND_SERVER",le="5000"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="query ListerLesCommandes",span_kind="SPAN_KIND_SERVER",le="10000"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="query ListerLesCommandes",span_kind="SPAN_KIND_SERVER",le="+Inf"}'
        values: "0+10x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: BudgetLatenceDepasse
        exp_alerts:
          - exp_labels:
              severity: ticket
              service_name: api
              span_name: query ListerLesCommandes
            exp_annotations:
              summary: "api / query ListerLesCommandes : P95 à 4850 ms"
              description: "Le P95 de cette opération dépasse 2 s depuis quinze minutes. Budget de latence de lecture épuisé. Ouvrir le dashboard du service, suivre un exemplar vers la trace."
              runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#budgetlatencedepasse"

  # ③ Une écriture lente côté navigateur (span CLIENT « mutation CreerCommande ») ne sonne pas ; la
  #    même côté serveur, entre 1 et 2 s, sonne avec un P95 de 1 950 ms.
  - interval: 1m
    input_series:
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="mutation CreerCommande",span_kind="SPAN_KIND_CLIENT",le="500"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="mutation CreerCommande",span_kind="SPAN_KIND_CLIENT",le="1000"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="mutation CreerCommande",span_kind="SPAN_KIND_CLIENT",le="2000"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="mutation CreerCommande",span_kind="SPAN_KIND_CLIENT",le="5000"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="mutation CreerCommande",span_kind="SPAN_KIND_CLIENT",le="10000"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="app-web",span_name="mutation CreerCommande",span_kind="SPAN_KIND_CLIENT",le="+Inf"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="mutation CreerCommande",span_kind="SPAN_KIND_SERVER",le="500"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="mutation CreerCommande",span_kind="SPAN_KIND_SERVER",le="1000"}'
        values: "0+0x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="mutation CreerCommande",span_kind="SPAN_KIND_SERVER",le="2000"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="mutation CreerCommande",span_kind="SPAN_KIND_SERVER",le="5000"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="mutation CreerCommande",span_kind="SPAN_KIND_SERVER",le="10000"}'
        values: "0+10x40"
      - series: 'traces_span_metrics_duration_milliseconds_bucket{service_name="api",span_name="mutation CreerCommande",span_kind="SPAN_KIND_SERVER",le="+Inf"}'
        values: "0+10x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: BudgetLatenceEcritureDepasse
        exp_alerts:
          - exp_labels:
              severity: ticket
              service_name: api
              span_name: mutation CreerCommande
            exp_annotations:
              summary: "api / mutation CreerCommande : écriture à 1950 ms au P95"
              description: "Le P95 de cette écriture dépasse 500 ms depuis quinze minutes. Vérifier les verrous et les requêtes lentes côté base avant de soupçonner le code applicatif."
              runbook_url: "https://github.com/SteveElouga/observabilite-universelle/blob/develop/observability/runbooks/README.md#budgetlatenceecrituredepasse"
