# otel-collector-config.yaml — le point de contrôle central (§3, §10.3)
# Réception OTLP → nettoyage → métriques dérivées des spans (AVANT échantillonnage)
# → échantillonnage tail-based → routage vers les backends.

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  # `spike_limit_mib` explicite : sans lui le Collector prend 20 % de `limit_mib`, ce qui
  # à 512 Mio laisse une marge trop fine — on refuse alors des lots entiers au lieu de
  # ralentir. La limite de conteneur posée dans docker-compose.yml (768 Mio) laisse la
  # place à ce plafond logiciel de se déclencher AVANT l'OOM killer du noyau.
  memory_limiter: { check_interval: 1s, limit_mib: 512, spike_limit_mib: 128 }

  # Enrichissement commun (labels disciplinés, §3.5)
  #
  # `insert` ET NON `upsert`, et c'est la correction du 14/09/2026. Avec `upsert`, la
  # valeur de DEPLOY_ENV (« prod » par défaut dans le Dockerfile et le compose) ÉCRASAIT
  # celle envoyée par les SDK : toute la télémétrie de développement d'un projet client
  # arrivait étiquetée `prod` (constaté : `label/deployment_environment/values` → ["prod"]
  # alors que les 9 services envoient `deployment.environment=dev`). Un environnement de
  # production partageant ce Collector aurait été indistinguable du reste.
  #
  # `insert` n'écrit QUE si la clé est absente : la valeur du SDK gagne toujours, la
  # variable du Collector ne sert plus que de défaut pour les émetteurs muets.
  #
  # Deux clés et non une : `deployment.environment` est DÉPRÉCIÉ par la convention
  # sémantique OpenTelemetry (« Replaced by deployment.environment.name »,
  # https://opentelemetry.io/docs/specs/semconv/registry/attributes/deployment/), dont
  # `deployment.environment.name` est la forme stable. On normalise donc ici, sans rien
  # casser : les SDK encore sur l'ancienne clé voient leur valeur recopiée sur la
  # nouvelle, les SDK migrés sont laissés tels quels, et l'ancienne clé est conservée le
  # temps que les tableaux de bord et requêtes existants migrent.
  resource:
    attributes:
      # 1. Migration : ancienne clé → nouvelle clé, seulement si la nouvelle est absente.
      - { key: deployment.environment.name, from_attribute: deployment.environment, action: insert }
      # 2. Défaut de la plateforme, seulement si le SDK n'a rien dit du tout.
      - { key: deployment.environment.name, value: "${env:DEPLOY_ENV}", action: insert }
      # 3. Compatibilité ascendante : l'ancienne clé reste renseignée pour les requêtes
      #    existantes, mais on ne l'écrase plus jamais.
      - { key: deployment.environment, from_attribute: deployment.environment.name, action: insert }

  # Hygiène : jeter le bruit et les données sensibles AVANT stockage
  filter/drop_noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/health/"'    # adapter à vos routes
        - 'attributes["http.route"] == "/ready/"'
  # Masquage revu le 08/09/2026 après audit réel d'un projet client (SGFE-backend, Python,
  # auto-instrumentation OTel pure : aucun `set_attribute` applicatif, aucune variable
  # OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_* définie nulle part → aucun en-tête HTTP n'est
  # aujourd'hui capturé en attribut de span, et aucun PII (email/téléphone/nom) n'y est mis ;
  # l'identité (`x-user-id`/`x-user-name`/`x-user-role`) ne transite qu'en métadonnées gRPC
  # internes vers l'audit applicatif, jamais vers un span). Rien à masquer côté SGFE aujourd'hui,
  # mais ce Collector est partagé entre plusieurs projets clients (§ « obs-edge ») : les règles
  # ci-dessous sont donc une défense en profondeur pour tout projet qui activerait la capture
  # d'en-têtes (ou dont le SDK/langage la capture par défaut), pas une réaction à un incident réel.
  # `db.statement` jugé suffisant tel quel : Django ORM + psycopg2 envoient des requêtes
  # paramétrées (`%s`), donc pas de valeur littérale (PII) dans le texte de la requête.
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.proxy-authorization, action: delete }   # forme alternative de l'auth HTTP (proxies)
      - { key: http.request.header.cookie, action: delete }                # cookie de session
      - { key: http.response.header.set-cookie, action: delete }           # émission de cookie de session
      - { pattern: 'http\.(request|response)\.header\..*(token|secret|api-?key|password).*', action: delete }  # en-têtes custom (X-Api-Key, X-Auth-Token, ...), toute casse déjà normalisée en minuscules par la convention sémantique
      - { key: enduser.id, action: hash }

  # Échantillonnage tail-based (§7.3) : 100 % des erreurs et des lentes, 10 % du reste
  tail_sampling:
    decision_wait: 10s
    policies:
      - { name: errors,  type: status_code,  status_code: { status_codes: [ERROR] } }
      - { name: slow,    type: latency,      latency: { threshold_ms: 500 } }
      - { name: baseline, type: probabilistic, probabilistic: { sampling_percentage: 10 } }

  # Cardinalité des opérations GraphQL BORNÉE avant le connecteur `spanmetrics`.
  #
  # Une API GraphQL reçoit tout sur `POST /graphql` : sans le nom de l'opération, spanmetrics
  # ne calcule qu'UNE latence et UN taux d'erreur pour toute l'API. La convention OpenTelemetry
  # fait donc poser par le serveur `graphql.operation.type`, `graphql.operation.name` et un span
  # renommé `{type} {nom}`. Or ce NOM VIENT DU CLIENT (`operationName` de la requête) : un
  # client qui en forge un nouveau à chaque appel crée une série Prometheus par appel, et
  # chaque série coûte de la mémoire au connecteur (qui ne les oublie jamais en mode cumulatif)
  # puis à Prometheus.
  #
  # `aggregation_cardinality_limit`, la borne native du connecteur, N'EXISTE PAS en 0.116.1
  # (`validate` répond « has invalid keys: aggregation_cardinality_limit ») ; et
  # `dimensions_cache_size` n'est qu'un cache, il ne plafonne pas le nombre de séries. La borne
  # est donc posée ici, en deux crans :
  #
  #   · SANS GRAPHQL_OPERATIONS_CONNUES (défaut) : un nom survit s'il respecte la grammaire
  #     GraphQL (`[_A-Za-z][_0-9A-Za-z]*`) et fait au plus 64 caractères. Le tableau ventile
  #     donc par opération sans rien déclarer ; un nom malformé ou démesuré devient `autre`.
  #     C'est une borne de FORME, pas de NOMBRE : un client authentifié qui forge un nom valide
  #     par appel ouvre encore une série par appel.
  #   · AVEC la variable (expression RE2, par exemple `ListerCommandes|CreerCommande`, ancrée
  #     ici) : liste blanche stricte, tout autre nom devient `autre`. C'est la borne de NOMBRE,
  #     à poser dès que le consommateur connaît ses opérations.
  #
  # `autre` s'écrit sur l'attribut ET sur le nom du span, `span.name` étant une dimension
  # native du connecteur. Le type vient du serveur, mais on le borne aussi aux trois valeurs de
  # la spécification GraphQL : un émetteur fautif ne doit pas rouvrir la porte.
  #
  # Ce processeur n'est branché QUE sur le pipeline des métriques dérivées : les traces
  # stockées dans Tempo gardent le nom réel, c'est lui qu'on cherche en enquête.
  transform/operations_bornees:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["graphql.operation.type"], "autre") where attributes["graphql.operation.type"] != nil and not IsMatch(attributes["graphql.operation.type"], "^(query|mutation|subscription)$$")
          - set(attributes["graphql.operation.name"], "autre") where attributes["graphql.operation.name"] != nil and (Len(attributes["graphql.operation.name"]) > 64 or not IsMatch(attributes["graphql.operation.name"], "^(?:${env:GRAPHQL_OPERATIONS_CONNUES:-[_A-Za-z][_0-9A-Za-z]*})$$"))
          - set(name, Concat([attributes["graphql.operation.type"], "autre"], " ")) where attributes["graphql.operation.name"] == "autre" and attributes["graphql.operation.type"] != nil
          - set(name, "autre") where attributes["graphql.operation.name"] == "autre" and attributes["graphql.operation.type"] == nil

  # Lots bornés : sans `send_batch_max_size`, un pic de trafic produit un lot unique
  # énorme que l'exportateur remote-write n'arrive pas à pousser dans son délai → le lot
  # entier est jeté (voir l'exportateur ci-dessous). 8192 points est la taille conseillée
  # par l'exportateur helper pour du remote-write Prometheus.
  batch: { timeout: 5s, send_batch_size: 8192, send_batch_max_size: 8192 }

# Métriques dérivées des spans — calculées sur 100 % du trafic, AVANT le tail sampling
connectors:
  # RED (débit/erreurs/latence) par service & route, sans instrumentation métrique.
  #
  # `metrics_flush_interval` N'EST PAS UN RÉGLAGE DE CONFORT. Par défaut le connecteur purge
  # toutes les 60 s, alors que Prometheus collecte toutes les 15 s. Les séries dérivées arrivent
  # donc quatre fois moins souvent que les autres — et `$__rate_interval`, calculé sur
  # l'intervalle de collecte, vaut 60 s : UN SEUL échantillon dans la fenêtre, donc `rate()` ne
  # rend RIEN. Tous les panneaux RED affichaient « No data » pendant que ceux de node-exporter
  # traçaient normalement. Mesuré : 60 s d'écart côté spanmetrics, 15 s côté node.
  #
  # Seaux réglés pour une API web, de 5 ms à 10 s. Les défauts du connecteur (2, 4, 6, 8, 10,
  # 50, 100, 200, 400, 800, 1000, 1400, 2000, 5000, 10000, 15000 ms) gaspillaient quatre seaux
  # sous 10 ms et n'avaient AUCUNE borne à 500 ms : HighLatencyP99 et BudgetLatenceEcriture-
  # Depasse (seuil 500 ms) comparaient une valeur interpolée entre 400 et 800. Tout seuil
  # d'alerte ou de SLO doit tomber SUR une borne : 500 (red.yml, budgets.yml) et 2000
  # (budgets.yml, `le="2000"` des SLO de latence). tests/test_retention_et_collecte.py le
  # vérifie sur chaque fichier qui lit l'histogramme.
  #
  # Dimensions GraphQL : bornées par `transform/operations_bornees` (voir plus haut). Absentes
  # d'un span (tout ce qui n'est pas une opération GraphQL), elles n'ajoutent aucune étiquette.
  spanmetrics:
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]
    dimensions:
      - name: graphql.operation.type
      - name: graphql.operation.name
  servicegraph: {}     # nourrit la carte des services de Grafana (écran 0)

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  # 133 386 points de métrique jetés en 6 h (« Exporting failed. Dropping data »,
  # `context deadline exceeded ») avant le 14/09/2026 : l'exportateur tournait avec les
  # valeurs par défaut, c'est-à-dire un délai de 5 s, aucune reprise et une file de
  # 10 000 éléments seulement. Sous charge (suites de tests parallèles), Prometheus met
  # plus de 5 s à accepter un lot et TOUT le lot part à la poubelle : les compteurs se
  # recalent au lot suivant, mais les histogrammes de la fenêtre sont perdus pour de bon.
  #
  # ⚠ `sending_queue` N'EXISTE PAS sur cet exportateur — il expose `remote_write_queue`
  # à la place (README de l'exportateur : « note that the exporter doesn't support
  # sending_queue but provides remote_write_queue »). Poser `sending_queue` ici
  # empêcherait le Collector de démarrer.
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write   # Mimir à l'échelle (§7.2)
    resource_to_telemetry_conversion: { enabled: true }
    timeout: 30s                       # 6× le défaut : absorbe une pause GC de Prometheus
    remote_write_queue:
      enabled: true
      queue_size: 50000                # ~5× le défaut : tient une minute de rafale
      num_consumers: 5
    retry_on_failure:
      enabled: true                    # défaut de l'helper, rendu explicite : c'est LA correction
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp                 # ingestion OTLP native de Loki 3

service:
  telemetry:
    metrics:                     # santé du Collector, scrapée par Prometheus (écran 12, §10.4)
      readers:                   # par défaut le Collector n'écoute que sur localhost → on ouvre 0.0.0.0
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/derive:                                   # ① 100 % des spans → métriques dérivées (PAS d'échantillonnage ici)
      receivers:  [otlp]
      processors: [memory_limiter, resource, filter/drop_noise, attributes/redact, transform/operations_bornees]
      exporters:  [spanmetrics, servicegraph]
    traces/store:                                    # ② échantillonnage tail-based, PUIS stockage dans Tempo
      receivers:  [otlp]
      processors: [memory_limiter, resource, filter/drop_noise, attributes/redact, tail_sampling, batch]
      exporters:  [otlp/tempo]
    metrics:
      receivers:  [otlp, spanmetrics, servicegraph]  # métriques SDK + métriques dérivées des spans
      processors: [memory_limiter, resource, batch]
      exporters:  [prometheusremotewrite]
    logs:                                            # utilisé surtout en K8s ;
      receivers:  [otlp]                             # en compose, les logs passent par Alloy (§10.4)
      processors: [memory_limiter, resource, batch]
      exporters:  [otlphttp/loki]
