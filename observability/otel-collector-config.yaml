# otel-collector-config.yaml — le point de contrôle central (§3, §10.3)
# Réception OTLP → nettoyage → métriques dérivées des spans (AVANT échantillonnage)
# → échantillonnage tail-based → routage vers les backends.

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter: { check_interval: 1s, limit_mib: 512 }

  # Enrichissement commun (labels disciplinés, §3.5)
  resource:
    attributes:
      - { key: deployment.environment, value: "${env:DEPLOY_ENV}", action: upsert }

  # Hygiène : jeter le bruit et les données sensibles AVANT stockage
  filter/drop_noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/health/"'    # adapter à vos routes
        - 'attributes["http.route"] == "/ready/"'
  # Masquage revu le 08/09/2026 après audit réel d'un projet client (SGFE-backend, Python,
  # auto-instrumentation OTel pure : aucun `set_attribute` applicatif, aucune variable
  # OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_* définie nulle part → aucun en-tête HTTP n'est
  # aujourd'hui capturé en attribut de span, et aucun PII (email/téléphone/nom) n'y est mis ;
  # l'identité (`x-user-id`/`x-user-name`/`x-user-role`) ne transite qu'en métadonnées gRPC
  # internes vers l'audit applicatif, jamais vers un span). Rien à masquer côté SGFE aujourd'hui,
  # mais ce Collector est partagé entre plusieurs projets clients (§ « obs-edge ») : les règles
  # ci-dessous sont donc une défense en profondeur pour tout projet qui activerait la capture
  # d'en-têtes (ou dont le SDK/langage la capture par défaut), pas une réaction à un incident réel.
  # `db.statement` jugé suffisant tel quel : Django ORM + psycopg2 envoient des requêtes
  # paramétrées (`%s`), donc pas de valeur littérale (PII) dans le texte de la requête.
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.proxy-authorization, action: delete }   # forme alternative de l'auth HTTP (proxies)
      - { key: http.request.header.cookie, action: delete }                # cookie de session
      - { key: http.response.header.set-cookie, action: delete }           # émission de cookie de session
      - { pattern: 'http\.(request|response)\.header\..*(token|secret|api-?key|password).*', action: delete }  # en-têtes custom (X-Api-Key, X-Auth-Token, ...), toute casse déjà normalisée en minuscules par la convention sémantique
      - { key: enduser.id, action: hash }

  # Échantillonnage tail-based (§7.3) : 100 % des erreurs et des lentes, 10 % du reste
  tail_sampling:
    decision_wait: 10s
    policies:
      - { name: errors,  type: status_code,  status_code: { status_codes: [ERROR] } }
      - { name: slow,    type: latency,      latency: { threshold_ms: 500 } }
      - { name: baseline, type: probabilistic, probabilistic: { sampling_percentage: 10 } }

  batch: { timeout: 5s }

# Métriques dérivées des spans — calculées sur 100 % du trafic, AVANT le tail sampling
connectors:
  # RED (débit/erreurs/latence) par service & route, sans instrumentation métrique.
  #
  # `metrics_flush_interval` N'EST PAS UN RÉGLAGE DE CONFORT. Par défaut le connecteur purge
  # toutes les 60 s, alors que Prometheus collecte toutes les 15 s. Les séries dérivées arrivent
  # donc quatre fois moins souvent que les autres — et `$__rate_interval`, calculé sur
  # l'intervalle de collecte, vaut 60 s : UN SEUL échantillon dans la fenêtre, donc `rate()` ne
  # rend RIEN. Tous les panneaux RED affichaient « No data » pendant que ceux de node-exporter
  # traçaient normalement. Mesuré : 60 s d'écart côté spanmetrics, 15 s côté node.
  spanmetrics:
    metrics_flush_interval: 15s
  servicegraph: {}     # nourrit la carte des services de Grafana (écran 0)

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write   # Mimir à l'échelle (§7.2)
    resource_to_telemetry_conversion: { enabled: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp                 # ingestion OTLP native de Loki 3

service:
  telemetry:
    metrics:                     # santé du Collector, scrapée par Prometheus (écran 12, §10.4)
      readers:                   # par défaut le Collector n'écoute que sur localhost → on ouvre 0.0.0.0
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/derive:                                   # ① 100 % des spans → métriques dérivées (PAS d'échantillonnage ici)
      receivers:  [otlp]
      processors: [memory_limiter, resource, filter/drop_noise, attributes/redact]
      exporters:  [spanmetrics, servicegraph]
    traces/store:                                    # ② échantillonnage tail-based, PUIS stockage dans Tempo
      receivers:  [otlp]
      processors: [memory_limiter, resource, filter/drop_noise, attributes/redact, tail_sampling, batch]
      exporters:  [otlp/tempo]
    metrics:
      receivers:  [otlp, spanmetrics, servicegraph]  # métriques SDK + métriques dérivées des spans
      processors: [memory_limiter, resource, batch]
      exporters:  [prometheusremotewrite]
    logs:                                            # utilisé surtout en K8s ;
      receivers:  [otlp]                             # en compose, les logs passent par Alloy (§10.4)
      processors: [memory_limiter, resource, batch]
      exporters:  [otlphttp/loki]
