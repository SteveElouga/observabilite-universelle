; supervisord.conf — supervision des processus du socle, dans une image unique.
;
; POURQUOI SUPERVISORD ET PAS s6-overlay. s6 est plus léger et gère mieux PID 1, mais sa
; configuration s'éclate en une arborescence de dossiers. Ici, une équipe de neuf personnes dont
; six ne sont pas familières de la supervision doit pouvoir lire ce fichier et comprendre ce qui
; tourne. Un fichier INI de quatre-vingts lignes gagne contre une arborescence. Le surcoût est
; d'environ quarante mégaoctets de Python sur une pile qui en consomme deux mille cinq cents.
;
; DOUZE PROGRAMMES depuis l'ajout des exportateurs (node, blackbox, postgres) : les neuf du
; socle plus les trois qui donnent leurs séries aux alertes §8.4 et aux dashboards §8.3 du
; consommateur. « Huit » figurait ici alors que le fichier en portait déjà neuf : compté, corrigé.
;
; Chaque programme porte `user=obs`. Aucun n'est root — c'est pourquoi Caddy écoute sur 8443/8080
; et non sur 443/80, qui exigeraient une capacité supplémentaire.

[supervisord]
; supervisord lui-même reste root : il n'ouvre aucun port, ne parle à aucun réseau, il ordonnance.
; C'est nécessaire pour deux raisons : ouvrir /dev/stdout (impossible après un changement
; d'utilisateur), et poser l'identité `obs` sur chaque programme ci-dessous. Les douze processus
; qui portent réellement la plateforme tournent donc sous `obs`, aucun sous root.
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:otel-collector]
command=/usr/local/bin/otelcol-contrib --config=/etc/otelcol/config.yaml
user=obs
priority=10
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:prometheus]
command=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/obs/prometheus --storage.tsdb.retention.time=15d --web.enable-remote-write-receiver --enable-feature=exemplar-storage
user=obs
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:loki]
command=/usr/local/bin/loki -config.file=/etc/loki/config.yaml
user=obs
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tempo]
command=/usr/local/bin/tempo -config.file=/etc/tempo/config.yaml
user=obs
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pyroscope]
command=/usr/local/bin/pyroscope -server.grpc-listen-port=9097
user=obs
; Pyroscope écrit ses statistiques d'usage dans « ./data », relatif au répertoire courant : sans
; ce `directory`, il tente de créer /data à la racine et meurt sur un refus de permission.
directory=/var/lib/obs/pyroscope
priority=20
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:alertmanager]
command=/usr/local/bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/var/lib/obs/alertmanager
user=obs
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:grafana]
command=/usr/share/grafana/bin/grafana server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini
user=obs
directory=/usr/share/grafana
priority=40
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:alloy]
command=/usr/local/bin/alloy run /etc/alloy/config.alloy --storage.path=/var/lib/obs/alloy
user=obs
priority=40
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=obs
priority=50
autorestart=true
startsecs=5
environment=XDG_DATA_HOME="/var/lib/obs/caddy",XDG_CONFIG_HOME="/var/lib/obs/caddy"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Exportateurs ─────────────────────────────────────────────────────────────────────────────
; Priorité 5 : ils démarrent AVANT Prometheus (priorité 15), sinon les premières salves de
; collecte tombent dans le vide et le graphe s'ouvre sur un trou de trente secondes.

[program:node-exporter]
; CE QU'IL MESURE, EXACTEMENT : le CONTENEUR, pas la machine. Le Dockerfile excluait jadis
; node-exporter pour cette raison — « embarqué, il mesurerait le conteneur au lieu de l'hôte ».
; L'objection tient, et la réponse est que le disque qui compte ici est /var/lib/obs, celui où
; Prometheus, Loki et Tempo écrivent : c'est précisément un volume de conteneur. Pour de vraies
; métriques machine, node-exporter reste un service à part, avec `pid: host` et `/:/host:ro`.
; `mount-points-exclude` écarte les trois bind-mounts que Docker injecte (/etc/hostname,
; /etc/hosts, /etc/resolv.conf) : ils rapportent la taille du disque sous-jacent et feraient
; croire à quatre systèmes de fichiers là où il n'y en a qu'un.
; `--collector.textfile.directory` : le point d'entrée des métriques que la plateforme ne peut
; pas collecter elle-même. Un travail de sauvegarde y dépose un fichier .prom, et l'alerte
; « sauvegarde absente » cesse d'être aveugle. Le répertoire est vide tant que personne n'écrit.
command=/usr/local/bin/node_exporter --collector.textfile.directory=/var/lib/obs/textfile --collector.filesystem.mount-points-exclude="^/(dev|proc|sys|etc/(hostname|hosts|resolv[.]conf))($|/)"
user=obs
priority=5
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:blackbox-exporter]
; Sondes en boîte noire. En mode compose c'était un conteneur ; ici c'est un processus, et les
; alias /etc/hosts posés par l'entrypoint font que prometheus.yml n'a pas une ligne à changer.
command=/usr/local/bin/blackbox_exporter --config.file=/etc/blackbox_exporter/config.yml
user=obs
priority=5
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres-exporter]
; NE DÉMARRE PAS PAR DÉFAUT. Sans chaîne de connexion, postgres_exporter sort immédiatement, et
; `autorestart=true` en ferait une boucle d'échecs bruyante qui masquerait les vraies pannes.
; L'entrypoint bascule PG_EXPORTER_AUTOSTART à « true » quand DATA_SOURCE_NAME est renseignée :
; le processus est alors absent OU sain, jamais en agonie permanente.
command=/usr/local/bin/postgres_exporter
user=obs
priority=5
autostart=%(ENV_PG_EXPORTER_AUTOSTART)s
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
