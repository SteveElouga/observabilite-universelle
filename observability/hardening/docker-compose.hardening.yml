# docker-compose.hardening.yml — surcouche de durcissement (lot #9 / §7.4).
#
# S'applique PAR-DESSUS le compose de base, depuis le dossier observability/ :
#   docker compose -f docker-compose.yml -f hardening/docker-compose.hardening.yml up -d --force-recreate
# (--force-recreate garantit que Caddy publie ses ports 80/443 : un conteneur Caddy déjà présent
#  serait sinon réutilisé sans publication. Détails et étape /etc/hosts dans hardening/README.md.)
#
# Effet : un reverse proxy Caddy termine le TLS et sert de point d'entrée unique ; les ports des
# services internes ne sont PLUS publiés sur l'hôte (ils restent joignables entre eux sur le réseau
# Docker, et depuis l'extérieur uniquement via Caddy). Accès : https://grafana.localhost,
# https://glitchtip.localhost, https://faro.localhost.
#
# Prérequis : Docker Compose >= 2.24 (pour le tag `!override`, qui remplace la liste `ports` du
# compose de base au lieu de s'y ajouter).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./hardening/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    depends_on: [grafana]

  # Dépublication des ports : accessibles seulement via Caddy sur le réseau Docker.
  grafana:        { ports: !override [] }
  prometheus:     { ports: !override [] }
  loki:           { ports: !override [] }
  tempo:          { ports: !override [] }
  pyroscope:      { ports: !override [] }
  alertmanager:   { ports: !override [] }
  glitchtip:      { ports: !override [] }
  uptime-kuma:    { ports: !override [] }
  otel-collector: { ports: !override [] }   # les apps émettent via le réseau Docker ; en prod, OTLP via le proxy TLS
  # Manquait à l'appel jusqu'au 08/09/2026 (trouvé en activant réellement cette surcouche pour la
  # première fois) : alloy publiait encore 12347 sur l'hôte alors que le Caddyfile reverse-proxy
  # déjà faro.localhost vers alloy:12347 — le point de collecte Faro restait donc joignable en
  # clair en contournant complètement Caddy (et donc le TLS), ce qui contredit l'objectif même de
  # cette surcouche. Symptôme observé : `docker compose ... up -d --force-recreate` échouait avec
  # « Bind for 0.0.0.0:12347 failed: port is already allocated » dès qu'une pile de base tournait
  # déjà sur la même machine (12347 pris deux fois) — ce qui a permis de repérer l'oubli.
  alloy:          { ports: !override [] }

volumes:
  caddy-data: {}
  caddy-config: {}
